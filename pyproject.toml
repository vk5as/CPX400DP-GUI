[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cpx400dp"
version = "0.1.1"
description = "Tkinter GUI for remote-controlling an Aim-TTi CPX400DP power supply over LAN"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "VK5AS", email = "vk5as.com@gmail.com" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications",
    "Environment :: Win32 (MS Windows)",
    "Environment :: MacOS X",
    "Intended Audience :: Science/Research",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Terminals",
]
dependencies = [
    "matplotlib>=3.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "black>=24",
    "ruff>=0.6",
    "mypy>=1.10",
    "bandit>=1.7",
]

[project.urls]
Homepage = "https://github.com/vk5as/CPX400DP-GUI"
Repository = "https://github.com/vk5as/CPX400DP-GUI"
Issues = "https://github.com/vk5as/CPX400DP-GUI/issues"

[project.scripts]
cpx400dp-gui = "cpx400dp.app:main"
cpx400dp-cli = "cpx400dp.cli:main"

[tool.setuptools.packages.find]
include = ["cpx400dp*"]

[tool.black]
line-length = 120
target-version = ["py310"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# Line length is Black's job; Ruff's E501 can disagree with it on strings
# Black deliberately leaves long (URLs, etc).
ignore = ["E501"]

[tool.mypy]
# Matches the interpreter mypy actually runs under, not requires-python's
# floor (3.10) — numpy's bundled stubs (a matplotlib dependency) use 3.12+
# syntax that mypy rejects when targeting an older version.
python_version = "3.13"
# tests/ import fake_cpx via a runtime sys.path.insert of tools/; mirror
# that statically so mypy can resolve it too.
mypy_path = "tools"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
# Test functions aren't expected to carry full type annotations (standard
# convention); still type-checked, just not required to be fully annotated.
module = "tests.*"
disallow_untyped_defs = false

[tool.bandit]
# tests/ isn't security-scanned (standard convention); the actual package
# and the bundled simulator are.
exclude_dirs = ["tests", ".venv"]
