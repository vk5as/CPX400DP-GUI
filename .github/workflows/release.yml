name: Release

# Manual only. Builds one universal wheel (this is a pure-Python package --
# there's no such thing as a separate "Python 3.12 wheel" vs "3.13 wheel"
# here), then proves that single wheel actually installs and runs on real
# Windows across Python 3.11-3.14 before creating a GitHub Release. The
# release step only runs if every gate before it passes.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Static analysis and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install package with dev dependencies
        run: pip install -e ".[dev]"
      - name: Black
        run: black --check cpx400dp/ tools/ tests/ scripts/
      - name: Ruff
        run: ruff check cpx400dp/ tools/ tests/ scripts/
      - name: mypy
        run: mypy cpx400dp/ tools/ tests/ scripts/
      - name: Bandit
        run: bandit -c pyproject.toml -r cpx400dp/ tools/ scripts/
      - name: pytest
        run: pytest tests/ -q

  build:
    name: Build wheel and sdist
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install build tooling
        run: pip install build
      - name: Build
        run: python -m build
      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  verify-windows:
    name: Verify on Windows (Python ${{ matrix.python-version }})
    needs: build
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Install the built wheel
        shell: bash
        run: |
          set -eu
          wheel=$(ls dist/*.whl)
          pip install "$wheel"
      - name: Verify GUI actually constructs (imports, theming, worker startup/shutdown)
        run: python scripts/ci_smoke_test.py
      - name: Verify CLI entry point
        run: cpx400dp-cli --help

  release:
    name: Create GitHub Release
    needs: verify-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Read version from pyproject.toml
        id: version
        run: |
          set -eu
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.version.outputs.version }}" \
            dist/*.whl dist/*.tar.gz \
            --title "v${{ steps.version.outputs.version }}" \
            --generate-notes
